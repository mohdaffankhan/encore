# Builds Encore for Android, Windows and Linux.
# - Push a tag like v0.2.0 to publish a GitHub release with the downloads.
# - Run it manually (Actions → Build → Run workflow) to just build and test.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/unit test/widget
      # Live YouTube checks: informative only, since YouTube often blocks
      # requests from CI servers.
      - run: flutter test test/live
        continue-on-error: true

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_FLAGS=--build-name=${GITHUB_REF_NAME#v} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing key secret; building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/encore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/encore.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release $VERSION_FLAGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/encore-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_FLAGS=--build-name=${GITHUB_REF_NAME#v} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - run: flutter build windows --release $VERSION_FLAGS
      - name: Portable zip and installer
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          powershell -Command "Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/encore-windows-portable.zip"
          command -v iscc || choco install innosetup -y --no-progress
          # Keep Git Bash from turning the /D switch into a file path.
          MSYS_NO_PATHCONV=1 iscc "/DAppVersion=$version" windows/installer.iss
          cp build/installer/encore-windows-setup.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_FLAGS=--build-name=${GITHUB_REF_NAME#v} --build-number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - run: flutter build linux --release $VERSION_FLAGS
      - run: |
          mkdir -p dist
          tar -czf dist/encore-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            | Device | Download |
            |---|---|
            | Android phone | `encore-android.apk` |
            | Windows PC | `encore-windows-setup.exe` (or the portable zip) |
            | Linux PC | `encore-linux-x64.tar.gz` (needs `libmpv2`) |

            Install steps are in the README.
