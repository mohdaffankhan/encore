# Builds Encore for Android, Windows and Linux.
# - Push a tag like v0.2.0 to create a DRAFT release with the downloads.
#   Nobody sees it until tool/release_check.sh has played music with those
#   exact files on real devices and published it.
# - Run it manually (Actions → Build → Run workflow) to just build and test.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux package versions match pubspec.yaml
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          grep -qx "pkgver=$version" linux/packaging/aur/PKGBUILD ||
            { echo "::error::PKGBUILD pkgver isn't $version"; exit 1; }
          grep -q "<release version=\"$version\"" linux/packaging/*.metainfo.xml ||
            { echo "::error::metainfo.xml has no release $version"; exit 1; }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/unit test/widget
      # Live YouTube checks: informative only, since YouTube often blocks
      # requests from CI servers.
      - run: flutter test test/live
        continue-on-error: true

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_FLAGS=--build-name=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing key secret; building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/encore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/encore.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release $VERSION_FLAGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/encore-android.apk
      # Release builds shrink resources; debug builds (and tests) don't.
      - run: sh tool/check_apk_resources.sh dist/encore-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_FLAGS=--build-name=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: flutter build windows --release $VERSION_FLAGS
      - name: Portable zip and installer
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # 7z, not Compress-Archive: that writes backslash paths, which
          # some unzip tools turn into flat file names.
          (cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../dist/encore-windows-portable.zip . > /dev/null)
          command -v iscc || choco install innosetup -y --no-progress
          # Keep Git Bash from turning the /D switch into a file path.
          MSYS_NO_PATHCONV=1 iscc "/DAppVersion=$version" windows/installer.iss
          cp build/installer/encore-windows-setup.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev patchelf
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_FLAGS=--build-name=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: flutter build linux --release $VERSION_FLAGS
      - name: Check bundled libraries
        run: |
          if ldd build/linux/x64/release/bundle/encore build/linux/x64/release/bundle/lib/*.so | grep 'not found'; then
            exit 1
          fi
      - name: Tarball (with launcher, icons and app metadata)
        run: sh linux/packaging/make_tarball.sh build/linux/x64/release/bundle dist/encore-linux-x64.tar.gz
      - name: Check plugin library paths
        run: |
          mkdir check && tar -xzf dist/encore-linux-x64.tar.gz -C check
          for lib in check/lib/*.so; do
            rpath=$(patchelf --print-rpath "$lib")
            if [ -n "$rpath" ] && [ "$rpath" != '$ORIGIN' ]; then
              echo "::error::$lib searches $rpath"; exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # The Flatpak, made from the tarball plus libmpv, in Flathub's builder.
  # Not released yet: built only when the workflow is run by hand.
  flatpak:
    if: github.event_name == 'workflow_dispatch'
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux/packaging/flatpak
      - uses: actions/cache@v4
        with:
          path: linux/packaging/flatpak/.flatpak-builder
          key: flatpak-${{ hashFiles('linux/packaging/flatpak/*.yml') }}
      - name: Build
        working-directory: linux/packaging/flatpak
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse             --repo=repo --force-clean build io.github.mohdaffankhan.Encore.yml
          mkdir -p ../../../dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo             repo ../../../dist/encore-linux-x64.flatpak io.github.mohdaffankhan.Encore
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  # The AUR package: builds and installs on Arch from this build's tarball.
  # Not released yet: built only when the workflow is run by hand.
  aur:
    if: github.event_name == 'workflow_dispatch'
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Build and install
        run: |
          pacman -Syu --noconfirm --needed base-devel namcap
          useradd -m builder
          mkdir /tmp/aur && cp linux/packaging/aur/PKGBUILD /tmp/aur/
          version=$(sed -n 's/^pkgver=//p' /tmp/aur/PKGBUILD)
          cp dist/encore-linux-x64.tar.gz "/tmp/aur/encore-linux-x64-$version.tar.gz"
          chown -R builder /tmp/aur
          cd /tmp/aur
          pacman -S --noconfirm --needed $(sed -n "s/^depends=(\(.*\))/\1/p" PKGBUILD | tr -d "'")
          su builder -c 'makepkg -f --noconfirm'
          namcap PKGBUILD
          pacman -U --noconfirm encore-music-bin-*.pkg.tar.zst
          test -x /usr/bin/encore-music

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: |
            | Platform | Download |
            |---|---|
            | Android | `encore-android.apk` |
            | Windows | `encore-windows-setup.exe` (or the portable zip) |
            | Linux | `encore-linux-x64.tar.gz` (needs `libmpv2`) |

            Install steps are in the README.
