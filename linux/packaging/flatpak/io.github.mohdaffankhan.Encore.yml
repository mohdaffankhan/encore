# Flatpak of Encore, made from the Linux release tarball (built by GitHub
# Actions) plus libmpv for sound, which the GNOME runtime doesn't have.
# Build (the tarball next to this file):
#   flatpak-builder --user --install-deps-from=flathub --repo=repo build \
#     io.github.mohdaffankhan.Encore.yml
# See .github/workflows/build.yml and tool/linux_release_check.sh.
app-id: io.github.mohdaffankhan.Encore
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: encore
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # Subtitles: mpv needs it to build, Encore never shows any.
  - name: libass
    config-opts:
      - --disable-static
      - --disable-asm
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  # mpv's renderer; only its basics are needed for audio.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=disabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Dlcms=disabled
      - -Ddovi=disabled
      - -Dlibdovi=disabled
      - -Dunwind=disabled
      - -Dxxhash=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Duchardet=disabled
      - -Drubberband=disabled
      - -Dzimg=disabled
      - -Dlcms2=disabled
      - -Dvapoursynth=disabled
      - -Dsdl2-audio=disabled
      - -Djack=disabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dspirv-cross=disabled
      - -Dpulse=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: encore
    buildsystem: simple
    build-commands:
      - rm bundle/install.sh
      - cp -r bundle /app/encore
      - mkdir -p /app/bin
      - ln -s /app/encore/encore /app/bin/encore
      - cp -r bundle/share /app/
      - rm -r /app/encore/share
    sources:
      - type: archive
        path: encore-linux-x64.tar.gz
        strip-components: 0
        dest: bundle
