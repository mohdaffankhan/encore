name: encore
description: "Encore: an ad-free, open-source YouTube Music client."
publish_to: 'none'
version: 0.1.3+5

environment:
  sdk: ^3.13.5

dependencies:
  audio_service: ^0.18.19
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_audio: ^1.0.7
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon_256.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
